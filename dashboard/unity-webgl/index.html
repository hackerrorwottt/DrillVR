<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>DrillVR Unity WebGL Standalone Player</title>
    <style>
      body {
        margin: 0;
        background: #070c18;
        color: #f8fafc;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        overflow: hidden;
      }
      #unity-container {
        position: relative;
        width: 960px;
        height: 600px;
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
        border-radius: 8px;
        overflow: hidden;
        background: #020617;
        border: 1px solid rgba(255, 255, 255, 0.12);
      }
      #unity-canvas {
        width: 100%;
        height: 100%;
        background: #020617;
      }
      #unity-loading-bar {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        display: block;
        text-align: center;
      }
      #unity-loading-text {
        font-size: 0.9rem;
        color: #94a3b8;
        margin-bottom: 8px;
      }
      #unity-progress-bar-empty {
        width: 220px;
        height: 8px;
        background: rgba(255, 255, 255, 0.1);
        border-radius: 999px;
        overflow: hidden;
      }
      #unity-progress-bar-full {
        height: 100%;
        width: 0%;
        background: #38bdf8;
        transition: width 0.2s;
      }
      #unity-warning {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        background: rgba(15, 23, 42, 0.95);
        color: #f87171;
        padding: 20px 24px;
        border-radius: 8px;
        border: 1px solid rgba(239, 68, 68, 0.3);
        font-size: 0.9rem;
        display: none;
        max-width: 500px;
        text-align: center;
        line-height: 1.5;
        box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
      }
      #unity-warning a {
        color: #38bdf8;
        text-decoration: underline;
      }
      #unity-footer {
        display: flex;
        justify-content: space-between;
        align-items: center;
        width: 960px;
        margin-top: 14px;
        font-size: 0.85rem;
        color: #94a3b8;
      }
      .btn {
        background: #0284c7;
        color: white;
        border: none;
        padding: 8px 16px;
        border-radius: 6px;
        cursor: pointer;
        font-size: 0.8rem;
        font-weight: 600;
        transition: background 0.15s;
      }
      .btn:hover {
        background: #0369a1;
      }
    </style>
  </head>
  <body>
    <div id="unity-container">
      <canvas id="unity-canvas" width="960" height="600" tabindex="-1"></canvas>
      <div id="unity-loading-bar">
        <div id="unity-loading-text">Loading DrillVR Simulation...</div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
      <div id="unity-warning"></div>
    </div>
    <div id="unity-footer">
      <div><strong>DrillVR</strong> &bull; Standalone WebGL Player &bull; Unity 6</div>
      <button id="unity-fullscreen-button" class="btn">Fullscreen</button>
    </div>

    <script>
      var canvas = document.querySelector("#unity-canvas");
      var loadingBar = document.querySelector("#unity-loading-bar");
      var progressBarFull = document.querySelector("#unity-progress-bar-full");
      var fullscreenButton = document.querySelector("#unity-fullscreen-button");
      var warningBanner = document.querySelector("#unity-warning");

      function unityShowBanner(msg, type) {
        if (type === 'error') {
          warningBanner.innerHTML = msg;
          warningBanner.style.display = 'block';
        }
      }

      var buildUrl = "Build";
      var buildName = "unity-webgl";
      var loaderUrl = buildUrl + "/" + buildName + ".loader.js";
      var config = {
        dataUrl: buildUrl + "/" + buildName + ".data",
        frameworkUrl: buildUrl + "/" + buildName + ".framework.js",
        codeUrl: buildUrl + "/" + buildName + ".wasm",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DrillVRTeam",
        productName: "DrillVR",
        productVersion: "2.4",
        showBanner: unityShowBanner,
      };

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = function () {
        createUnityInstance(canvas, config, function (progress) {
          progressBarFull.style.width = (100 * progress) + "%";
        }).then(function (unityInstance) {
          loadingBar.style.display = "none";
          fullscreenButton.onclick = function () {
            unityInstance.SetFullscreen(1);
          };
        }).catch(function (err) {
          loadingBar.style.display = "none";
          unityShowBanner("<strong>WebGL Build Incomplete</strong><br><br>The build loader was found but WASM binaries could not load.<br><small>" + err + "</small>", "error");
        });
      };
      script.onerror = function () {
        loadingBar.style.display = "none";
        unityShowBanner("<strong>Unity WebGL Build Not Found</strong><br><br>Expected build loader at: <code>dashboard/unity-webgl/Build/" + buildName + ".loader.js</code>.<br><br>Open the project in Unity 6 and run:<br><code>DrillVR &gt; Build WebGL for Dashboard</code>", "error");
      };
      document.body.appendChild(script);
    </script>
  </body>
</html>
